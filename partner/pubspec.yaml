name: vakil_partner
description: "Vakil Partner - Advocate onboarding & KYC app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  socket_io_client: ^3.1.2
  audioplayers: ^6.8.1
  vibration: ^3.2.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  zego_express_engine: ^3.25.0
  flutter_callkit_incoming: ^3.1.6
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
